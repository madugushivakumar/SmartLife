<!-- =========================================
     UPDATED ADVANCED CALENDAR SECTION
     REPLACE YOUR OLD TASK SECTION WITH THIS
========================================= -->

<div class="tasks">

  <div class="tasks-header">

    <h3>Smart Calendar</h3>

    <!-- CALENDAR CONTROLS -->
    <div class="calendar-controls">

      <button id="prevMonth" class="nav-btn">
        ←
      </button>

      <h4 id="monthYear"></h4>

      <button id="nextMonth" class="nav-btn">
        →
      </button>

    </div>

    <!-- VIEW TOGGLE -->
    <div class="view-toggle">

      <button
        class="view-btn active"
        data-view="list"
        id="listViewBtn"
      >
        <i class="fa-solid fa-list"></i>
        List
      </button>

      <button
        class="view-btn"
        data-view="calendar"
        id="calendarViewBtn"
      >
        <i class="fa-solid fa-calendar-days"></i>
        Calendar
      </button>

    </div>

  </div>

  <!-- TODAY TASKS -->
  <div id="todayTasks" class="today-tasks"></div>

  <!-- TASK LIST -->
  <div id="taskList"></div>

  <!-- CALENDAR -->
  <div id="calendarView" class="calendar hidden"></div>

  <!-- ADD TASK -->
  <div class="add-task">

    <input
      type="text"
      id="taskInput"
      placeholder="Add new task..."
    />

    <select id="taskPriority">

      <option value="High">
        High
      </option>

      <option value="Medium" selected>
        Medium
      </option>

      <option value="Low">
        Low
      </option>

    </select>

    <input
      type="date"
      id="taskDate"
    />

    <button id="addBtn">
      Add Task
    </button>

  </div>

</div>

<!-- =========================================
     CALENDAR CSS
========================================= -->

<style>

.calendar-controls{
  display:flex;
  align-items:center;
  gap:15px;
}

.nav-btn{
  width:40px;
  height:40px;
  border:none;
  border-radius:10px;
  background:#1e293b;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.nav-btn:hover{
  background:#38bdf8;
  transform:scale(1.05);
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:12px;
  margin-top:25px;
}

.week-name{
  text-align:center;
  font-weight:bold;
  color:#94a3b8;
  padding:10px;
}

.day-box{
  background:#1e293b;
  min-height:130px;
  border-radius:18px;
  padding:12px;
  transition:0.3s;
  position:relative;
  overflow:hidden;
}

.day-box:hover{
  transform:translateY(-3px);
  background:#263548;
}

.today{
  border:2px solid #38bdf8;
  box-shadow:0 0 20px rgba(56,189,248,0.4);
}

.day-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.day-number{
  font-size:18px;
  font-weight:bold;
}

.today-label{
  background:#38bdf8;
  color:white;
  padding:3px 8px;
  border-radius:20px;
  font-size:10px;
}

.calendar-tasks{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.task-dot{
  font-size:12px;
  padding:6px 8px;
  border-radius:8px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.task-dot.high{
  background:#7f1d1d;
  color:#f87171;
}

.task-dot.medium{
  background:#78350f;
  color:#facc15;
}

.task-dot.low{
  background:#14532d;
  color:#4ade80;
}

.more-tasks{
  font-size:11px;
  color:#94a3b8;
  margin-top:5px;
}

.empty-box{
  background:transparent;
}

.hidden{
  display:none;
}

.today-tasks{
  margin-bottom:20px;
}

.today-card{
  background:#0f172a;
  padding:15px;
  border-radius:15px;
  margin-bottom:10px;
  border-left:5px solid #38bdf8;
}

@media(max-width:900px){

  .calendar{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  .calendar{
    grid-template-columns:1fr;
  }

}

</style>

<!-- =========================================
     ADVANCED CALENDAR SCRIPT
========================================= -->

<script>

let currentDate = new Date();

const calendarView =
  document.getElementById("calendarView");

const monthYear =
  document.getElementById("monthYear");

const prevMonth =
  document.getElementById("prevMonth");

const nextMonth =
  document.getElementById("nextMonth");

const listViewBtn =
  document.getElementById("listViewBtn");

const calendarViewBtn =
  document.getElementById("calendarViewBtn");

const taskList =
  document.getElementById("taskList");

const todayTasks =
  document.getElementById("todayTasks");

/* =========================================
   VIEW TOGGLE
========================================= */

listViewBtn.addEventListener("click",()=>{

  taskList.classList.remove("hidden");

  calendarView.classList.add("hidden");

  listViewBtn.classList.add("active");

  calendarViewBtn.classList.remove("active");

});

calendarViewBtn.addEventListener("click",()=>{

  taskList.classList.add("hidden");

  calendarView.classList.remove("hidden");

  calendarViewBtn.classList.add("active");

  listViewBtn.classList.remove("active");

  renderCalendar();

});

/* =========================================
   MONTH NAVIGATION
========================================= */

prevMonth.addEventListener("click",()=>{

  currentDate.setMonth(
    currentDate.getMonth() - 1
  );

  renderCalendar();

});

nextMonth.addEventListener("click",()=>{

  currentDate.setMonth(
    currentDate.getMonth() + 1
  );

  renderCalendar();

});

/* =========================================
   RENDER CALENDAR
========================================= */

function renderCalendar(){

  calendarView.innerHTML = "";

  const year =
    currentDate.getFullYear();

  const month =
    currentDate.getMonth();

  const firstDay =
    new Date(year,month,1).getDay();

  const daysInMonth =
    new Date(year,month + 1,0).getDate();

  const today =
    new Date();

  const monthNames = [

    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"

  ];

  monthYear.innerText =
    `${monthNames[month]} ${year}`;

  const weekDays = [

    "SUN",
    "MON",
    "TUE",
    "WED",
    "THU",
    "FRI",
    "SAT"

  ];

  weekDays.forEach(day=>{

    calendarView.innerHTML += `
      <div class="week-name">
        ${day}
      </div>
    `;

  });

  /* EMPTY BOXES */

  for(let i=0;i<firstDay;i++){

    calendarView.innerHTML += `
      <div class="empty-box"></div>
    `;

  }

  /* DAYS */

  for(let date=1;date<=daysInMonth;date++){

    const isToday =

      date === today.getDate() &&
      month === today.getMonth() &&
      year === today.getFullYear();

    /* GET TASKS */

    const tasksForDay =
      AppState.tasks.filter(task=>{

        if(
          !task.date ||
          task.date === "No Date"
        ){
          return false;
        }

        const d =
          new Date(task.date);

        return (

          d.getDate() === date &&
          d.getMonth() === month &&
          d.getFullYear() === year

        );

      });

    let taskHTML = "";

    tasksForDay.slice(0,2).forEach(task=>{

      taskHTML += `

        <div class="task-dot ${task.priority.toLowerCase()}">

          ${task.title}

        </div>

      `;

    });

    if(tasksForDay.length > 2){

      taskHTML += `

        <div class="more-tasks">

          +${tasksForDay.length - 2} more

        </div>

      `;
    }

    calendarView.innerHTML += `

      <div class="day-box ${isToday ? "today" : ""}">

        <div class="day-top">

          <span class="day-number">
            ${date}
          </span>

          ${
            isToday
            ?
            `<span class="today-label">Today</span>`
            :
            ""
          }

        </div>

        <div class="calendar-tasks">

          ${taskHTML}

        </div>

      </div>

    `;
  }

}

/* =========================================
   TODAY TASKS
========================================= */

function renderTodayTasks(){

  const today =
    new Date();

  todayTasks.innerHTML = "";

  const tasks =
    AppState.tasks.filter(task=>{

      if(
        !task.date ||
        task.date === "No Date"
      ){
        return false;
      }

      const d =
        new Date(task.date);

      return (

        d.getDate() === today.getDate() &&
        d.getMonth() === today.getMonth() &&
        d.getFullYear() === today.getFullYear()

      );

    });

  if(tasks.length === 0){

    todayTasks.innerHTML = `

      <div class="today-card">

        No tasks scheduled for today 🚀

      </div>

    `;

    return;
  }

  tasks.forEach(task=>{

    todayTasks.innerHTML += `

      <div class="today-card">

        <strong>${task.title}</strong>

        <br>

        Priority:
        ${task.priority}

      </div>

    `;

  });

}

/* =========================================
   AUTO LOAD
========================================= */

renderCalendar();

renderTodayTasks();

</script>
